<head>
  <meta charset="utf-8" />

  <title>Reports</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #5c5c5c;
      --link: #0969da;
      --bg: #fafafa;
      --card: #fff;
      --border: #e5e5e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6e6e6;
        --muted: #9a9a9a;
        --link: #58a6ff;
        --bg: #0d1117;
        --card: #161b22;
        --border: #30363d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      padding: 2rem 1.25rem;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
    }
    p.lead {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      margin-bottom: 0.75rem;
    }
    li a {
      display: block;
      padding: 1rem 1.1rem;
      color: var(--link);
      text-decoration: none;
      font-weight: 500;
    }
    li a:hover {
      text-decoration: underline;
    }
    li a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
    }
  </style>
</head>
