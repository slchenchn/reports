<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="920" viewBox="0 0 1380 920" role="img" aria-labelledby="title desc">
<title id="title">Kernel Agent 的经验管理闭环</title>
<desc id="desc">顶部经验库连接积累、召回使用和管理三条路径。中间路径从经验库召回并筛选经验，执行 kernel 后产生反馈。反馈沿左右路径向上，分别生成并验收新经验、更新与遗忘旧经验。遗忘也可以直接重置当前上下文</desc>
<defs>
 <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5275ad"/></marker>
 <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#218778"/></marker>
 <marker id="amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ba783c"/></marker>
 <style>
 text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203047}
 .heading{font-size:25px;font-weight:600}
 .node-title{font-size:22px;font-weight:600}
 .sub{font-size:16px;fill:#637183}
 .phase{font-size:19px;font-weight:600}
 .small{font-size:14px;fill:#8c633c}
 </style>
</defs>
<rect width="1380" height="920" fill="#fff"/>
<text x="690" y="43" text-anchor="middle" class="heading">Kernel Agent 的经验管理闭环</text>

