<rect x="940" y="207" width="390" height="533" rx="22" fill="#fcf6ef" stroke="none" stroke-width="1.4"/>
<text x="145" y="244" text-anchor="middle" class="phase" style="fill:#416594">01  经验积累</text>
<text x="590" y="244" text-anchor="middle" class="phase" style="fill:#21796d">02  召回与使用</text>
<text x="1035" y="244" text-anchor="middle" class="phase" style="fill:#9b642e">03  更新与遗忘</text>
<rect x="390" y="80" width="600" height="90" rx="18" fill="#f1f4f9" stroke="#c5cfdf" stroke-width="1.4"/>
<text x="690" y="116" text-anchor="middle" class="node-title">经验库  Memory / skills</text>
<text x="690" y="145" text-anchor="middle" class="sub">经验内容 · 适用条件 · 执行证据 · 权重与有效状态</text>
<rect x="75" y="274" width="340" height="100" rx="14" fill="#fff" stroke="#ccd8ec" stroke-width="1.4"/>
<text x="245" y="310" text-anchor="middle" class="node-title">写入经验库</text>
<text x="245" y="344" text-anchor="middle" class="sub">保存通过验收的经验及证据</text>
<rect x="75" y="434" width="340" height="100" rx="14" fill="#fff" stroke="#ccd8ec" stroke-width="1.4"/>
<text x="245" y="470" text-anchor="middle" class="node-title">验证与筛选</text>
<text x="245" y="504" text-anchor="middle" class="sub">检查正确性、收益与适用范围</text>
<rect x="75" y="594" width="340" height="100" rx="14" fill="#fff" stroke="#ccd8ec" stroke-width="1.4"/>
<text x="245" y="630" text-anchor="middle" class="node-title">提炼候选经验</text>
<text x="245" y="664" text-anchor="middle" class="sub">优化策略 · 适用条件 · 成败证据</text>
<rect x="520" y="274" width="340" height="100" rx="14" fill="#fff" stroke="#b9dcd2" stroke-width="1.4"/>
<text x="690" y="310" text-anchor="middle" class="node-title">按当前任务召回</text>
<text x="690" y="344" text-anchor="middle" class="sub">任务特征 · 硬件 · shape</text>
<rect x="520" y="434" width="340" height="100" rx="14" fill="#fff" stroke="#b9dcd2" stroke-width="1.4"/>
<text x="690" y="470" text-anchor="middle" class="node-title">筛选与上下文注入</text>
<text x="690" y="504" text-anchor="middle" class="sub">相关性 · 证据质量 · token 预算</text>
<rect x="520" y="594" width="340" height="100" rx="14" fill="#fff" stroke="#b9dcd2" stroke-width="1.4"/>
<text x="690" y="630" text-anchor="middle" class="node-title">适配并执行 kernel</text>
<text x="690" y="664" text-anchor="middle" class="sub">正确性测试 · 性能测量</text>
<rect x="965" y="274" width="340" height="100" rx="14" fill="#fff" stroke="#e8d3bc" stroke-width="1.4"/>
