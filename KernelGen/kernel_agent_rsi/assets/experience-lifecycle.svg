<rect x="965" y="434" width="340" height="100" rx="14" fill="#fff" stroke="#e8d3bc" stroke-width="1.4"/>
<text x="1135" y="470" text-anchor="middle" class="node-title">更新与选择性遗忘</text>
<text x="1135" y="499" text-anchor="middle" class="sub">修正、合并、降权或撤回旧经验</text>
<text x="1135" y="521" text-anchor="middle" class="sub">按需重置当前搜索上下文</text>
<rect x="965" y="594" width="340" height="100" rx="14" fill="#fff" stroke="#e8d3bc" stroke-width="1.4"/>
