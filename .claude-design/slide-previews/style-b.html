<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style B: Dark Botanical</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #0f0f0f; }

.slide {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: 'IBM Plex Sans', sans-serif;
    background: #0f0f0f;
    color: #e8e4df;
}

/* Abstract gradient circles */
.orb-1 {
    position: absolute;
    top: -15%;
    right: -10%;
    width: clamp(250px, 45vw, 550px);
    height: clamp(250px, 45vw, 550px);
    background: radial-gradient(circle, rgba(212, 165, 116, 0.2) 0%, rgba(212, 165, 116, 0.05) 40%, transparent 70%);
    border-radius: 50%;
    filter: blur(40px);
    animation: float 8s ease-in-out infinite;
}

.orb-2 {
    position: absolute;
    bottom: -20%;
    left: -5%;
    width: clamp(200px, 35vw, 450px);
    height: clamp(200px, 35vw, 450px);
    background: radial-gradient(circle, rgba(232, 180, 184, 0.15) 0%, rgba(232, 180, 184, 0.03) 45%, transparent 70%);
    border-radius: 50%;
    filter: blur(50px);
    animation: float 10s ease-in-out 2s infinite reverse;
}

.orb-3 {
    position: absolute;
    top: 40%;
    left: 25%;
    width: clamp(100px, 20vw, 250px);
    height: clamp(100px, 20vw, 250px);
    background: radial-gradient(circle, rgba(201, 184, 150, 0.1) 0%, transparent 60%);
    border-radius: 50%;
    filter: blur(30px);
    animation: float 12s ease-in-out 4s infinite;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(15px, -20px); }
}

/* Thin accent line */
.accent-line {
    position: absolute;
    left: clamp(3rem, 8vw, 8rem);
    top: 15%;
    height: 70%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(212, 165, 116, 0.3), transparent);
    animation: lineReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: top;
    transform: scaleY(0);
}

@keyframes lineReveal {
    to { transform: scaleY(1); }
}

.content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: min(80vw, 700px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 3vw, 2.5rem);
}

.eyebrow {
    font-size: clamp(0.6rem, 1vw, 0.8rem);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #d4a574;
    animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    opacity: 0;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

h1 {
    font-family: 'Cormorant', serif;
    font-weight: 400;
    font-size: clamp(2.5rem, 7vw, 5.5rem);
    line-height: 1.1;
    color: #e8e4df;
    animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    opacity: 0;
    transform: translateY(30px);
}

@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}

h1 em {
    font-style: italic;
    color: #d4a574;
}

.subtitle {
    font-weight: 300;
    font-size: clamp(0.8rem, 1.5vw, 1.1rem);
    color: #9a9590;
    line-height: 1.6;
    max-width: 500px;
    animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
    opacity: 0;
    transform: translateY(30px);
}

.divider {
    width: clamp(30px, 5vw, 60px);
    height: 1px;
    background: linear-gradient(to right, transparent, #c9b896, transparent);
    animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
    opacity: 0;
}

.meta {
    font-size: clamp(0.55rem, 0.9vw, 0.75rem);
    color: #9a9590;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
    opacity: 0;
}
</style>
</head>
<body>
<section class="slide">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="orb-3"></div>
    <div class="accent-line"></div>
    <div class="content">
        <span class="eyebrow">调研报告</span>
        <h1>Harness<br><em>Engineering</em></h1>
        <p class="subtitle">让 agent 在真实工程里长时间持续做对的执行系统设计</p>
        <div class="divider"></div>
        <span class="meta">2026 · 技术复盘</span>
    </div>
</section>
</body>
</html>
